# Secret scanning of the repository and of its whole history: `gitleaks git` (see the CI).
# The default rules of gitleaks (Slack tokens included), plus the Claude subscription token.

title = "hive"

[extend]
useDefault = true

[[rules]]
id = "anthropic-oauth-token"
description = "Claude subscription token (claude setup-token)"
regex = '''sk-ant-oat[0-9]{2}-[A-Za-z0-9_\-]{60,}'''
keywords = ["sk-ant-oat"]

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-api[0-9]{2}-[A-Za-z0-9_\-]{60,}'''
keywords = ["sk-ant-api"]

[[allowlists]]
description = "Checksums of the dependencies"
paths = ['''Cargo\.lock$''']
