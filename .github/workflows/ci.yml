name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # every week: new advisories on the dependencies, new Claude Code in the image
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same pull request cancels the run in progress; the runs of main go to the end, to
# save the caches every pull request starts from. Jobs that must run after a failure use !cancelled()
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: Secrets (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks, whole history (default rules + Claude tokens of .gitleaks.toml)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: gitleaks, working tree (files ignored by git included)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      - name: trufflehog, whole history (verified and unverified secrets)
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown,unverified
      - name: no credentials or runtime data committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)company/|\.sqlite|hive\.db'; then
            echo "::error::.env, company/ and databases must not be committed"; exit 1
          fi

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked
      - name: Test fixture and docs generator compile
        run: python3 -m py_compile tests/fixtures/fake_claude.py docs/make_pdf.py

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Unix only: the daemon listens on a Unix socket
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # unit tests + end-to-end tests: the real daemon, CLI and MCP bridge, with a scripted fake claude
      - name: Unit and end-to-end tests
        run: cargo nextest run --locked --profile ci
      - name: Test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ matrix.os }}
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      # the end-to-end tests run the instrumented binary: daemon, CLI and MCP bridge are covered too
      - name: Tests with coverage
        run: cargo llvm-cov nextest --locked --profile ci --no-report
      - name: Reports (lcov, HTML, summary)
        run: |
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --html --output-dir coverage
          {
            echo "## Coverage"
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # a ratchet: raise it as the Slack bot (the main untested part) gets covered
      - name: Minimum coverage
        run: cargo llvm-cov report --summary-only --fail-under-lines 55
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/html
      - name: Codecov (when the CODECOV_TOKEN secret is set)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hive:ci
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: The binary and Claude Code are installed
        run: |
          docker run --rm hive:ci --version
          docker run --rm --entrypoint claude hive:ci --version
      # the whole chain inside the container: init, daemon, a task given to an agent, and the claude
      # run failing cleanly without credentials
      - name: Smoke test without credentials
        run: |
          mkdir company && chmod 777 company
          docker run --rm -v "$PWD/company:/company" hive:ci init /company
          docker run -d --name hive -v "$PWD/company:/company" hive:ci
          for i in $(seq 1 30); do docker exec hive hive status >/dev/null 2>&1 && break; sleep 1; done
          docker exec hive hive task "smoke test"
          for i in $(seq 1 60); do
            docker exec hive hive show 1 | grep -q "status: failed" && break; sleep 1
          done
          docker exec hive hive show 1 | tee show.txt
          docker logs hive
          grep -q "status: failed" show.txt
          grep -qi "not logged in\|login\|auth" show.txt
          docker rm -f hive
      - name: Image size
        run: docker images hive:ci --format '{{.Size}}' | tee -a "$GITHUB_STEP_SUMMARY"

  audit:
    name: Vulnerabilities of the dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  report:
    name: Test report
    needs: [test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # job permissions replace the workflow ones: contents is needed to read the commit
    permissions:
      actions: read
      checks: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: junit
      - name: Publish the results of every platform in a "Test results" check
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Test results
          files: junit/**/*.xml
